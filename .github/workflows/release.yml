name: Package & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.8.0), created from the selected branch. Leave empty for a dev pre-release."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          # Passed via env (not inlined into the script) so the input is data, not code.
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ] && [[ ! "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid tag '$INPUT_TAG' (expected e.g. v1.2.3)"
            exit 1
          fi
          if [[ -n "$INPUT_TAG" ]]; then
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Package integration zip
        run: |
          TAG=${{ steps.version.outputs.tag }}
          ZIP="intg-kodi-mpchc-${TAG}.zip"
          zip -j "$ZIP" driver.json requirements.txt src/*.py
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: "intg-kodi-mpchc ${{ steps.version.outputs.tag }}"
          body: |
            ## Kodi / MPC-HC Bridge — UC Remote 3 Integration

            ### Installation
            1. Lade `intg-kodi-mpchc-*.zip` herunter
            2. Öffne die UC Remote App → Integrationen → Aus Datei installieren
            3. Wähle die ZIP-Datei aus
            4. Setup-Flow: Bridge-Host und Port eingeben (Standard: `localhost:13590`)

            ### Voraussetzungen
            - [kodi-mpchc-bridge](https://github.com/Zendonir/kodi-mpchc-bridge/releases) läuft auf dem Windows-PC
            - Bridge-Port 13590 ist in der Firewall freigegeben
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') && inputs.tag == '' }}
          files: ${{ env.ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
